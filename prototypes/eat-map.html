<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>饮食图谱原型</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; padding: 24px; background: #f2f2f0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #2C2C2A; display: flex; justify-content: center; }
  .phone { width: 390px; height: 820px; background: #fff; border-radius: 36px; border: 1px solid #e2e2df; overflow: hidden; position: relative; display: flex; flex-direction: column; }
  .scroll { flex: 1; overflow-y: auto; padding: 28px 20px 24px; }
  h1 { font-size: 20px; font-weight: 500; margin: 0 0 6px; }
  .sub { font-size: 13px; color: #7a7a74; line-height: 1.6; margin: 0 0 20px; }
  .glance { background: #E6F1FB; border: 1px solid #B5D4F4; border-radius: 14px; padding: 14px 16px; margin-bottom: 6px; }
  .glance-tag { font-size: 11px; color: #185FA5; margin-bottom: 6px; }
  .glance-line { font-size: 15px; line-height: 1.55; color: #0C447C; }
  .glance-go { font-size: 12px; color: #185FA5; margin-top: 10px; cursor: pointer; }
  .count { font-size: 12px; color: #7a7a74; margin: 14px 0 12px; }
  .map { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .region { border-radius: 16px; padding: 12px 8px 10px; }
  .r0 { background: #F1EFE8; } .r1 { background: #FBEAF0; } .r2 { background: #EAF3DE; } .r3 { background: #FAEEDA; }
  .rname { font-size: 12px; font-weight: 500; color: #44443f; margin: 0 0 2px 6px; }
  .rdays { font-size: 10px; color: #90908a; margin: 0 0 10px 6px; }
  .row { display: flex; justify-content: space-around; margin-bottom: 8px; }
  .row.a { padding: 0 10px; } .row.b { padding: 0 26px; }
  .dot { width: 52px; text-align: center; cursor: pointer; }
  .dot .ball { width: 34px; height: 34px; border-radius: 50%; margin: 0 auto 4px; border: 1px solid #C9C7C0; background: #EDEDEA; transition: background .18s, border-color .18s; }
  .dot .lbl { font-size: 10px; color: #90908a; line-height: 1.25; }
  .dot.seen .ball { background: #B5D4F4; border-color: #378ADD; }
  .dot.seen .lbl { color: #185FA5; }
  .dot.on .ball { box-shadow: 0 0 0 3px rgba(55,138,221,.22); }
  .sheet-mask { position: absolute; inset: 0; background: rgba(0,0,0,.28); display: none; }
  .sheet-mask.show { display: block; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 20px 20px 0 0; padding: 20px 22px 28px; display: none; max-height: 74%; overflow-y: auto; }
  .sheet.show { display: block; }
  .s-tag { font-size: 11px; color: #90908a; }
  .s-title { font-size: 18px; font-weight: 500; margin: 6px 0 16px; }
  .layer { margin-bottom: 14px; }
  .layer .k { font-size: 11px; color: #185FA5; margin-bottom: 4px; }
  .layer .v { font-size: 14px; line-height: 1.65; color: #33332f; }
  .close { width: 100%; height: 44px; border: 1px solid #dcdcd8; border-radius: 22px; background: #fff; font-size: 15px; color: #44443f; cursor: pointer; margin-top: 6px; }
  .dock { height: 62px; border-top: 1px solid #e5e5e5; background: #f5f5f5; display: flex; align-items: center; }
  .slot { flex: 1; text-align: center; color: #9a9a94; font-size: 11px; }
  .slot .g { width: 20px; height: 20px; margin: 0 auto 4px; border: 2px solid currentColor; border-radius: 50%; }
  .slot .g.sq { border-radius: 5px; }
  .slot.on { color: #2C2C2A; }
</style>
</head>
<body>
<div class="phone">
  <div class="scroll">
    <h1>饮食图谱</h1>
    <p class="sub">28 个能用的点，分成四块。翻过的会亮起来，剩下的是你还没看的。</p>

    <div class="glance">
      <div class="glance-tag" id="gTag">今天这一句</div>
      <div class="glance-line" id="gLine"></div>
      <div class="glance-go" id="gGo">去看看 ›</div>
    </div>

    <div class="count" id="count"></div>

    <div class="map" id="map"></div>
  </div>

  <div class="sheet-mask" id="mask"></div>
  <div class="sheet" id="sheet">
    <div class="s-tag" id="sTag"></div>
    <div class="s-title" id="sTitle"></div>
    <div id="sBody"></div>
    <button class="close" id="close">收起</button>
  </div>

  <div class="dock">
    <div class="slot"><div class="g"></div>打卡</div>
    <div class="slot"><div class="g sq"></div>学习</div>
    <div class="slot on"><div class="g sq" style="border-radius:50% 50% 4px 4px"></div>饮食</div>
    <div class="slot"><div class="g sq" style="border-width:2px 2px 0 0;border-radius:6px 6px 0 0"></div>看板</div>
    <div class="slot"><div class="g" style="border-radius:50% 50% 0 0;border-bottom:0"></div>我的</div>
  </div>
</div>

<script>
var THEMES = [
  { name: '吃的基础', from: 1 },
  { name: '外食与外卖', from: 8 },
  { name: '自己做饭', from: 15 },
  { name: '长期稳住', from: 22 }
];

var NODES = [
  { s:'看整体', t:'先看整体，不算卡路里', l1:'减脂看长期趋势，不看单顿的数字。', l2:'用盘子比例和饱腹感判断，比算热量容易坚持得多。', l3:'有医学需求（糖尿病、肾病）时遵医嘱，别照搬。' },
  { s:'蛋白质', t:'蛋白质每顿都要有', l1:'每餐一个手掌大小的蛋白质。', l2:'鸡蛋、鱼、鸡胸、豆腐、牛奶轮着来；早餐最容易漏。', l3:'肾功能异常的人要控制蛋白总量，先问医生。' },
  { s:'主食', t:'主食别砍光', l1:'主食减半，不要归零。', l2:'白米换成杂粮饭、玉米、红薯，饱得更久。', l3:'高强度训练日要加回来，不然练不动。' },
  { s:'先吃菜', t:'蔬菜先吃', l1:'先吃菜，再吃蛋白，最后吃主食。', l2:'前半盘先装蔬菜，顺序一换，主食自然吃得少。', l3:'胃寒或容易胀气的人，生冷蔬菜别一次吃太多。' },
  { s:'脂肪', t:'脂肪不是敌人', l1:'要少的是烹饪油，不是所有脂肪。', l2:'坚果一小把、鱼、橄榄油都留着；避开油炸和反复用油。', l3:'胆囊问题或医嘱限脂时要另行调整。' },
  { s:'喝水', t:'先分清渴和饿', l1:'想吃东西时先喝一杯水，等十分钟。', l2:'一天分几次喝，别等到口渴才一次灌很多。', l3:'大量出汗后只喝白水不够，要补一点电解质。' },
  { s:'别饿着', t:'饿太久会反弹', l1:'别把自己饿到失控。', l2:'两餐间隔太长就加个小加餐：酸奶、鸡蛋、水果。', l3:'需要空腹的检查或医嘱禁食除外。' },

  { s:'看做法', t:'点餐先看做法', l1:'蒸、煮、拌优先，避开红烧、干锅、油焖。', l2:'同一样菜，做法不同能差出一碗饭的热量。', l3:'偶尔想吃重口的，留一顿，别顿顿。' },
  { s:'备注', t:'备注真的有用', l1:'备注写「少油少盐」，多数店会照做。', l2:'酱汁分装、主食减半，也可以一起写在备注里。', l3:'连锁店出餐标准化，备注可能没用，那就靠挑菜。' },
  { s:'主食', t:'主食另点更稳', l1:'别顺手再加一份白米饭。', l2:'换成杂粮饭或玉米；或者只要半份。', l3:'运动量大的那天可以照常吃。' },
  { s:'饮料', t:'汤和饮料藏热量', l1:'甜饮料、浓汤是最容易忽略的那部分。', l2:'换成无糖茶、苏打水、清汤。', l3:'长时间运动后可以喝含糖的，帮助恢复。' },
  { s:'小份', t:'一个人吃也好点', l1:'单人餐选小份组合，比一份大套餐好控制。', l2:'一份蛋白 + 一份蔬菜 + 半份主食。', l3:'也要留够能量，别为了少而少。' },
  { s:'剩一半', t:'剩一半不算浪费', l1:'吃不完就停下，不必清盘。', l2:'一开始就拨出一半打包，比吃到撑再后悔容易。', l3:'别把「打包」变成下一顿的加餐。' },
  { s:'常备店', t:'常备三两家店', l1:'固定几家能点出健康组合的店。', l2:'收藏好搭配，忙的时候不用临时纠结。', l3:'换城市、出差的时候重新找一遍。' },

  { s:'一盘', t:'一盘子的比例', l1:'半盘蔬菜、四分之一蛋白、四分之一主食。', l2:'先按这个比例装盘，再去调味。', l3:'重体力或大训练量时，主食那一格要加大。' },
  { s:'用油', t:'用油有个数', l1:'一餐用油控制在一汤匙以内。', l2:'用带刻度的油壶，热锅冷油，别等冒烟。', l3:'空气炸、烤箱能少油，但不代表可以多吃。' },
  { s:'调味', t:'调味换个思路', l1:'用醋、柠檬、黑胡椒、蒜来替代酱。', l2:'一勺沙拉酱、一勺豆瓣酱都可能顶半碗饭。', l3:'高血压人群还要另外控盐。' },
  { s:'做两顿', t:'一次做两顿', l1:'做一次，吃两顿，省得临时乱吃。', l2:'蛋白和主食批量做，蔬菜现做。', l3:'绿叶菜隔夜口感和安全都不好，别提前太久。' },
  { s:'冰箱底', t:'冰箱里留底', l1:'常备鸡蛋、酸奶、冷冻蔬菜、速冻虾仁。', l2:'没时间做饭时，这些东西十分钟能凑一顿。', l3:'加工肉肠不算「底」，尽量少囤。' },
  { s:'别饿着买', t:'别在饿的时候逛超市', l1:'吃饱了再去买菜。', l2:'先列清单，按清单拿。', l3:'囤多了也别硬吃，冻起来。' },
  { s:'固定的碗', t:'家里的秤和碗', l1:'用固定的碗装饭，比每次估更准。', l2:'秤用两周就够，之后靠手感。', l3:'不想用秤就别用，别让它变成负担。' },

  { s:'体重波动', t:'体重会波动', l1:'一天上下一两公斤很正常。', l2:'看一周的平均，不看单日的数字。', l3:'连续两周单向上升再考虑调整。' },
  { s:'平台期', t:'平台期不是失败', l1:'几周没变化，很可能只是水分和适应。', l2:'先检查睡眠和总摄入，再动饮食。', l3:'超过一个月没变化，再考虑换方案。' },
  { s:'聚餐', t:'聚餐有预案', l1:'聚餐前先吃个蛋白垫底。', l2:'桌上先挑蔬菜和蛋白，酒水选无糖。', l3:'偶尔放开吃一顿也没关系，第二天正常回来。' },
  { s:'夜宵', t:'夜宵不是禁忌', l1:'真饿了就吃，选温热、好消化的。', l2:'无糖酸奶、鸡蛋、一小碗粥，比硬扛到天亮好。', l3:'睡前两小时内别吃太撑，会影响睡眠。' },
  { s:'嘴还是饿', t:'先分辨嘴馋还是真饿', l1:'嘴馋是特指某一样，真饿是什么都想吃。', l2:'真饿还会胃叫、发软；嘴馋不会。', l3:'如果经常靠吃来缓解情绪，值得找人聊聊。' },
  { s:'出差', t:'出差和旅行', l1:'先保证蛋白和蔬菜，其他放宽。', l2:'便利店也能凑一顿：茶叶蛋 + 酸奶 + 玉米。', l3:'长途路上别只吃干粮，记得喝水。' },
  { s:'吃多了', t:'吃多了下一顿回来', l1:'一顿吃多不用补偿，下一顿照常。', l2:'别跳餐、别加倍运动去「抵消」。', l3:'如果经常出现暴食，建议寻求专业帮助。' }
];

var seen = {};
var order = [];
var openDay = 0;

function themeOf(d) {
  for (var i = THEMES.length - 1; i >= 0; i--) if (d >= THEMES[i].from) return i;
  return 0;
}

function drawMap() {
  var html = '';
  for (var i = 0; i < THEMES.length; i++) {
    html += '<div class="region r' + i + '"><div class="rname">' + THEMES[i].name + '</div>';
    html += '<div class="rdays">第 ' + THEMES[i].from + '–' + (THEMES[i].from + 6) + ' 天</div>';
    var rows = [[0, 1, 2], [3, 4], [5, 6]];
    for (var r = 0; r < rows.length; r++) {
      html += '<div class="row ' + (r === 0 ? 'a' : 'b') + '">';
      for (var k = 0; k < rows[r].length; k++) {
        var d = THEMES[i].from + rows[r][k];
        var n = NODES[d - 1];
        html += '<div class="dot' + (seen[d] ? ' seen' : '') + (openDay === d ? ' on' : '') + '" onclick="openN(' + d + ')">';
        html += '<div class="ball"></div><div class="lbl">' + n.s + '</div></div>';
      }
      html += '</div>';
    }
    html += '</div>';
  }
  document.getElementById('map').innerHTML = html;
}

function drawCount() {
  var n = Object.keys(seen).length;
  document.getElementById('count').textContent = '28 个里，你翻过 ' + n + ' 个';
}

function nextUp() {
  for (var d = 1; d <= NODES.length; d++) if (!seen[d]) return d;
  return order.length ? order[0] : 1;
}

function drawGlance() {
  var d = nextUp();
  var n = NODES[d - 1];
  document.getElementById('gTag').textContent = '第 ' + d + ' 天 · ' + THEMES[themeOf(d)].name;
  document.getElementById('gLine').textContent = n.l1;
  document.getElementById('gGo').onclick = function () { openN(d); };
}

function openN(d) {
  openDay = d;
  var n = NODES[d - 1];
  if (!seen[d]) { seen[d] = 1; order.push(d); }
  document.getElementById('sTag').textContent = '第 ' + d + ' 天 · ' + THEMES[themeOf(d)].name;
  document.getElementById('sTitle').textContent = n.t;
  document.getElementById('sBody').innerHTML =
    '<div class="layer"><div class="k">记住一句</div><div class="v">' + n.l1 + '</div></div>' +
    '<div class="layer"><div class="k">怎么用</div><div class="v">' + n.l2 + '</div></div>' +
    '<div class="layer"><div class="k">什么时候不适用</div><div class="v">' + n.l3 + '</div></div>';
  document.getElementById('sheet').classList.add('show');
  document.getElementById('mask').classList.add('show');
  drawMap(); drawCount(); drawGlance();
}

function shut() {
  openDay = 0;
  document.getElementById('sheet').classList.remove('show');
  document.getElementById('mask').classList.remove('show');
  drawMap();
}

document.getElementById('close').onclick = shut;
document.getElementById('mask').onclick = shut;
drawMap(); drawCount(); drawGlance();
</script>
</body>
</html>
